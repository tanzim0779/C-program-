 el.innerHTML=`<div class="stage"><video playsinline muted></video><canvas></canvas></div>
 <div class="row"><button class="btn" id="a">Start</button><button class="btn g" id="sw">Switch camera</button><button class="btn g" id="sn">Snapshot</button><b class="mono" id="f">0 FPS</b></div>
 <div class="hint" id="st">Press Start. The model (~5 MB) downloads on first use.</div><div id="l"></div>`;
 const v=$('video',el),c=$('canvas',el),x=c.getContext('2d'),st=$('#st',el);
 const stopCam=()=>{stream&&stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null};
 const col=n=>`hsl(${[...n].reduce((a,ch)=>a+ch.charCodeAt(0)*7,0)%360} 90% 55%)`;
 async function cam(){stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:false});v.srcObject=stream;await v.play()}
 async function start(){
  if(!navigator.onLine){st.textContent='You are offline. The model needs internet to download.';return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Camera is not available (HTTPS and a camera are required).';return}
  try{
   if(!model){st.innerHTML='<div class="sk"></div>Loading model…';
    await loadJS('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
    await loadJS('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
    model=await cocoSsd.load()}
   await cam();run=true;$('#a',el).textContent='Stop';st.textContent='Detecting…';loop()
  }catch(e){st.textContent=e&&e.name=='NotAllowedError'?'Camera permission was denied. Allow it in your browser settings.':e&&e.name=='NotFoundError'?'No camera found on this device.':'Could not start: '+(e.message||e);run=false}}
 function stop(){run=false;cancelAnimationFrame(raf);stopCam();x.clearRect(0,0,c.width,c.height);$('#a',el).textContent='Start';st.textContent='Stopped.'}
 async function loop(){if(!run)return;
  if(v.readyState>=2){const p=await model.detect(v);if(!run)return;c.width=v.videoWidth;c.height=v.videoHeight;x.clearRect(0,0,c.width,c.height);x.lineWidth=3;x.font='bold 18px Inter';
   p.forEach(o=>{const[a,b,w,h]=o.bbox,k=col(o.class),t=`${o.class} ${Math.round(o.score*100)}%`;x.strokeStyle=k;x.strokeRect(a,b,w,h);const tw=x.measureText(t).width+10;x.fillStyle=k;x.fillRect(a,Math.max(0,b-24),tw,24);x.fillStyle='#000';x.fillText(t,a+5,Math.max(18,b-6))});
   $('#l',el).innerHTML=p.map(o=>`<div class="hint"><b style="color:${col(o.class)}">●</b> ${esc(o.class)} – ${Math.round(o.score*100)}%</div>`).join('')||'<div class="hint">No objects detected.</div>';
   fr++;const n=performance.now();if(n-t0>1000){$('#f',el).textContent=Math.round(fr*1000/(n-t0))+' FPS';fr=0;t0=n}}
  raf=requestAnimationFrame(loop)}
 $('#a',el).onclick=()=>run?stop():start();
 $('#sw',el).onclick=async()=>{face=face=='environment'?'user':'environment';if(run){try{await cam()}catch(e){toast('Cannot switch camera')}}};
 $('#sn',el).onclick=()=>{if(!v.videoWidth)return toast('Start the camera first');const s=document.createElement('canvas');s.width=v.videoWidth;s.height=v.videoHeight;const q=s.getContext('2d');q.drawImage(v,0,0);q.drawImage(c,0,0);s.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='snapshot.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});toast('Snapshot saved')};
 return{destroy(){stop()}}}

/* ===== TOOL: YOUTUBE SEARCH ===== */
    
function yt(el){
 let rc=[];try{rc=JSON.parse(S.get('yts','[]'))}catch(e){}
 el.innerHTML=`<div class="row"><input id="q" placeholder="Search YouTube…" aria-label="Search YouTube"><button class="btn" id="go">Search</button></div><div class="chips" id="c"></div><div id="p"></div><div class="grid" id="r"></div>`;
 const q=$('#q',el),r=$('#r',el),K=YOUTUBE_API_KEY;
 const chips=()=>$('#c',el).innerHTML=rc.map(x=>`<button>${esc(x)}</button>`).join('');chips();
 const dur=s=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s||'');if(!m)return'';const p=n=>String(n||0).padStart(2,'0');return(m[1]?m[1]+':':'')+(m[1]?p(m[2]):(m[2]||0))+':'+p(m[3])};
 async function go(){const t=q.value.trim();if(!t)return;
  if(K.startsWith('YOUR')){r.innerHTML='<p class="hint">Setup needed: open index.html, find <b>YOUTUBE_API_KEY</b> and paste a YouTube Data API v3 key (Google Cloud Console → APIs &amp; Services).</p>';return}
  if(!navigator.onLine){r.innerHTML='<p class="err">You are offline.</p>';return}
  rc=[t,...rc.filter(x=>x!=t)].slice(0,6);S.set('yts',JSON.stringify(rc));chips();
  r.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try{const j=await(await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(t)}&key=${K}`)).json();
   if(j.error){r.innerHTML=`<p class="err">${esc(j.error.message||'API error')} (quota or key problem)</p>`;return}
   const ids=j.items.map(i=>i.id.videoId).join(',');let D={};
   try{const k=await(await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${ids}&key=${K}`)).json();(k.items||[]).forEach(i=>D[i.id]=dur(i.contentDetails.duration))}catch(e){}
   r.innerHTML=j.items.map(i=>`<button class="vc" data-id="${esc(i.id.videoId)}"><img loading="lazy" alt="" src="${esc(i.snippet.thumbnails.medium.url)}"><div>${esc(dec(i.snippet.title))}<br><small>${esc(dec(i.snippet.channelTitle))}${D[i.id.videoId]?' · '+D[i.id.videoId]:''}</small></div></button>`).join('')||'<p class="hint">No results.</p>'
  }catch(e){r.innerHTML='<p class="err">Network error. Check your connection.</p>'}}
 $('#go',el).onclick=go;q.onkeydown=e=>{if(e.key=='Enter')go()};
 $('#c',el).onclick=e=>{const b=e.target.closest('button');if(b){q.value=b.textContent;go()}};
 r.onclick=e=>{const b=e.target.closest('.vc');if(!b)return;
  $('#p',el).innerHTML=`<div class="row"><button class="btn g sm" id="th">Theatre mode</button></div><iframe class="player" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.id)}?autoplay=1" title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  $('#th',el).onclick=()=>$('.player',el).classList.toggle('wide');$('.player',el).scrollIntoView({behavior:'smooth',block:'center'})};
 return{destroy(){el.innerHTML=''}}}

/* ===== TOOL: GOOGLE SEARCH (Programmable Search Engine) ===== */
function gg(el){
 if(GOOGLE_CSE_ID.startsWith('YOUR')){el.innerHTML='<p class="hint">Setup needed: create a Programmable Search Engine at programmablesearchengine.google.com, copy its Search engine ID, then paste it into <b>GOOGLE_CSE_ID</b> in index.html.</p>';return{destroy(){}}}
 if(!navigator.onLine){el.innerHTML='<p class="err">You are offline.</p>';return{destroy(){}}}
 el.innerHTML='<div class="gcse-search"></div>';const s=document.createElement('script');s.async=true;s.src='https://cse.google.com/cse.js?cx='+encodeURIComponent(GOOGLE_CSE_ID);el.appendChild(s);
 return{destroy(){el.innerHTML=''}}}

/* ===== TOOL: EXAM TIMER ===== */
function tmr(el){
 let end=0,left=0,total=0,state='idle',iv,wl,fired={},mute=S.get('mute','0')=='1',ac;
 el.innerHTML=`<input id="lb" placeholder="Label (e.g. Maths Exam)" aria-label="Label">
 <div class="tm" style="margin-top:8px"><input id="h" type="number" min="0" max="99" placeholder="Hours" aria-label="Hours"><input id="m" type="number" min="0" max="59" placeholder="Min" aria-label="Minutes"><input id="s" type="number" min="0" max="59" placeholder="Sec" aria-label="Seconds"></div>
 <div class="row" id="pr">${[5,10,30,60,120].map(n=>`<button class="btn g sm" data-m="${n}">${n} min</button>`).join('')}</div>
 <svg class="ring" viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" stroke="var(--bd)" stroke-width="12"/><circle id="rg" cx="110" cy="110" r="96" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="0" transform="rotate(-90 110 110)"/><text id="tx" x="110" y="122" text-anchor="middle">00:00:00</text></svg>
 <div class="row" style="justify-content:center"><button class="btn" id="go">Start</button><button class="btn g" id="rs">Reset</button><button class="btn g" id="mu"></button></div><div class="hint" id="n" style="text-align:center"></div>`;
 const g=s=>$(s,el),C=603.2;
 const pad=n=>String(n).padStart(2,'0'),show=ms=>{const s=Math.max(0,Math.ceil(ms/1000));g('#tx').textContent=`${pad(s/3600|0)}:${pad(s%3600/60|0)}:${pad(s%60)}`;
  const p=total?ms/(total*1000):0;g('#rg').style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,p)));g('#rg').style.stroke=p>.5?'var(--ac)':p>.2?'#ffb020':'#ff4d4d'};
 const mu=()=>g('#mu').textContent=mute?'🔇 Muted':'🔔 Sound on';mu();
 const beep=n=>{if(mute)return;try{ac=ac||new AudioContext();for(let i=0;i<n;i++){const o=ac.createOscillator(),q=ac.createGain();o.connect(q);q.connect(ac.destination);o.frequency.value=880;const t=ac.currentTime+i*.35;q.gain.setValueAtTime(.25,t);q.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.27)}}catch(e){}};
 const alert2=(m,n)=>{beep(n);navigator.vibrate&&navigator.vibrate([200,100,200]);el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);toast(m);g('#n').textContent=m};
 const lock=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
 const unlock=()=>{try{wl&&wl.release()}catch(e){}wl=null};
 const vis=()=>{if(document.visibilityState=='visible'&&state=='run')lock()};document.addEventListener('visibilitychange',vis);
 function tick(){left=end-Date.now();show(left);const s=left/1000;
  [600,300,60].forEach(th=>{if(s<=th&&!fired[th]&&total>th){fired[th]=1;alert2(th/60+' minute(s) left',2)}});
  if(left<=0){clearInterval(iv);state='idle';unlock();show(0);alert2('Time is up!',4);g('#go').textContent='Start'}}
 g('#go').onclick=()=>{
  if(state=='run'){left=end-Date.now();clearInterval(iv);state='pause';g('#go').textContent='Resume';unlock();return}
  if(state=='idle'){total=(+g('#h').value||0)*3600+(+g('#m').value||0)*60+(+g('#s').value||0);if(!total)return toast('Set a time first');left=total*1000;fired={}}
  end=Date.now()+left;state='run';g('#go').textContent='Pause';lock();clearInterval(iv);iv=setInterval(tick,200);tick();if(ac&&ac.state=='suspended')ac.resume()};
 g('#rs').onclick=()=>{clearInterval(iv);state='idle';unlock();total=0;g('#go').textContent='Start';g('#n').textContent='';show(0)};
 g('#mu').onclick=()=>{mute=!mute;S.set('mute',mute?'1':'0');mu()};
 g('#pr').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=+b.dataset.m;g('#h').value=m/60|0;g('#m').value=m%60;g('#s').value=0};
 return{destroy(){clearInterval(iv);unlock();document.removeEventListener('visibilitychange',vis);if(ac)try{ac.close()}catch(e){}}}}

/* ===== APP SHELL ===== */
const TABS=[{n:'Tap 1',o:[{f:calc,t:'Calculator',d:'Basic and scientific maths',i:'calc'},{f:conv,t:'Number Converter',d:'Binary, octal, decimal, hex',i:'conv'},{f:det,t:'Object Detector',d:'Live camera AI detection',i:'cam'}]},
 {n:'Tap 2',o:[{f:yt,t:'YouTube Search',d:'Search and watch here',i:'yt'},{f:gg,t:'Google Search',d:'Embedded web search',i:'gs'},{f:tmr,t:'Exam Timer',d:'Countdown with alerts',i:'tm'}]}];
const PAL=[['midnight','#16307a'],['royal','#7c3aed'],['emerald','#0e9f6e'],['sunset','#f59e0b'],['light','#e8eeff']];
let tab=+S.get('tab',0)||0,opt=+S.get('opt',0)||0,cur=null;
const tool=$('#tool');
function render(){
 $('#tabs').dataset.i=tab;$('#tabs').querySelectorAll('button').forEach(b=>b.remove());
 TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.n;b.setAttribute('role','tab');b.setAttribute('aria-selected',i==tab);b.className=i==tab?'on':'';b.onclick=()=>go(i,0);$('#tabs').appendChild(b)});
 $('#opts').innerHTML=TABS[tab].o.map((o,i)=>`<button class="opt glass${i==opt?' on':''}" data-i="${i}" aria-pressed="${i==opt}">${ic(o.i)}<b>${o.t}</b><span>${o.d}</span></button>`).join('');
 if(cur&&cur.destroy)cur.destroy();tool.style.animation='none';void tool.offsetWidth;tool.style.animation='';tool.innerHTML='';
 try{cur=TABS[tab].o[opt].f(tool)}catch(e){tool.innerHTML='<p class="err">Could not open this tool.</p>';console.error(e)}}
function go(t,o){tab=t;opt=o;S.set('tab',t);S.set('opt',o);render()}
$('#opts').onclick=e=>{const b=e.target.closest('.opt');if(b&&+b.dataset.i!=opt)go(tab,+b.dataset.i)};
/* theme */
function theme(n){document.documentElement.dataset.theme=n;S.set('theme',n);const m=document.querySelector('meta[name=theme-color]');m.content=getComputedStyle(document.documentElement).getPropertyValue('--b1').trim()||'#0b1230'}
$('#pal').innerHTML=PAL.map(([n,c])=>`<button role="menuitem" aria-label="${n}" title="${n}" style="background:${c}" data-t="${n}"></button>`).join('');
$('#pal').onclick=e=>{const b=e.target.closest('[data-t]');if(b){theme(b.dataset.t);$('#pal').classList.remove('on')}};
$('#pb').innerHTML=ic('pal');$('#pb').onclick=()=>$('#pal').classList.toggle('on');
$('#fs').innerHTML=ic('fs');$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>toast('Fullscreen not available'))};
theme(PAL.some(p=>p[0]==S.get('theme','midnight'))?S.get('theme','midnight'):'midnight');
/* PWA: data-URI manifest + install button */
const mf={name:'Toolbox Pro',short_name:'Toolbox',start_url:'./',display:'standalone',background_color:'#0b1230',theme_color:'#0b1230',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235cc8ff'/%3E%3C/svg%3E",sizes:'any',type:'image/svg+xml'}]};
const lk=document.createElement('link');lk.rel='manifest';lk.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));document.head.appendChild(lk);
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true}};
/* offline notice and shortcuts */
addEventListener('offline',()=>toast('You are offline. Search and AI model need internet.'));addEventListener('online',()=>toast('Back online ✓'));
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
 if(k=='1'||k=='2')go(+k-1,0);else if('qwe'.includes(k)&&k.length==1)go(tab,'qwe'.indexOf(k));
 else if(k=='t'){const i=PAL.findIndex(p=>p[0]==document.documentElement.dataset.theme);theme(PAL[(i+1)%PAL.length][0])}
 else if(k=='?')toast('1/2 tabs · Q/W/E tools · T theme')});
render();addEventListener('load',()=>setTimeout(()=>$('#splash').classList.add('off'),600));
setTimeout(()=>$('#splash').classList.add('off'),2500);
})();
</script>
